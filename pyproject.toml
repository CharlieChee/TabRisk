[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthgen"
version = "0.1.0"
description = "Tabular synthetic data generation with SynthCity backend (CTGAN/TVAE/PATEGAN)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "hydra-core>=1.3.0",
    "pytest>=7.4.0",
    # SynthCity 后端（当前稳定）
    "synthcity>=0.2.0,<0.3.0",
    # 显式约束：避免 opacus 使用 torch.nn.RMSNorm 导致 import 崩溃（opacus 1.5+ 需 torch 2.10+）
    "torch>=2.0,<2.1",
    "opacus>=1.3,<1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
# 显式列出包及子包，避免 synthgen.data / synthgen.models 未被安装
packages = ["synthgen", "synthgen.data", "synthgen.models"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
