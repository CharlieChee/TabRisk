[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthgen"
version = "0.1.0"
description = "Tabular synthetic data generation with SynthCity backend (CTGAN/TVAE/PATEGAN)"
readme = "README.md"
requires-python = ">=3.11"
# 版本上界与 environment.lock.yml / requirements.lock.txt 一致，不超出服务器真实运行环境
dependencies = [
    "pandas>=2.0.0,<=2.3.3",
    "numpy>=1.24.0,<=1.26.4",
    "pyarrow>=12.0.0,<=22.0.0",
    "pydantic>=1.10,<2",
    "rich>=13.0.0,<=14.3.2",
    "loguru>=0.7.0,<=0.7.3",
    "hydra-core>=1.3.0,<=1.3.2",
    "pytest>=7.4.0,<=9.0.2",
    "scipy>=1.11.0,<=1.11.4",
    # SynthCity 后端（与 lock 一致）
    "synthcity>=0.2.0,<0.3.0",
    # 与 lock 一致：避免 opacus 使用 torch.nn.RMSNorm 导致 import 崩溃（opacus 1.5+ 需 torch 2.10+）
    "torch==2.0.1",
    "opacus==1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
# 显式列出包及子包，避免 synthgen.data / synthgen.models 未被安装
packages = ["synthgen", "synthgen.data", "synthgen.models"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
