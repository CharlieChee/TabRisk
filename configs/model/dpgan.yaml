# SynthCity DPGAN 模型配置
_target_: synthgen.models.synthcity_models.SynthCityDPGANModel
name: dpgan
params:
  device: cpu                 # cpu | cuda，命令行可 override：model.params.device=cuda
  cuda_visible_devices: null  # 例如 "6" 或 "0"；null 表示不设置 CUDA_VISIBLE_DEVICES
  n_iter: ${epochs}
  batch_size: ${batch_size}
  verbose: ${verbose}
  generator_n_layers_hidden: 2
  generator_n_units_hidden: 256
  discriminator_n_layers_hidden: 2
  discriminator_n_units_hidden: 256
  # 差分隐私：clipping norm (C) 与 noise multiplier (σ)，命令行可覆盖
  dp_max_grad_norm: 2.0       # clipping norm C，梯度裁剪阈值，如 model.params.dp_max_grad_norm=1.0
  # noise_multiplier 若插件支持，可用 +model.params.noise_multiplier=1.0；先运行 python scripts/debug_dpgan_params.py 查看插件实际参数名

