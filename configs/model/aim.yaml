# SynthCity AIM 模型配置（带 FAST baseline 预设）
_target_: synthgen.models.synthcity_models.SynthCityAIMModel
name: aim
params:
  # DP budget（保持 SynthCity 默认）
  epsilon: 1.0
  delta: 1e-9

  # FAST PRESET：大幅减小搜索空间与容忍度，加快 baseline 运行并避免候选集不足
  degree: 1
  # 关键：将 num_marginals 降到较小默认值，避免超过候选集合大小
  num_marginals: 5
  max_model_size: 10
  max_cells: 100
  sampling_patience: 20
  compress_dataset: true

  # 避免误导：AIM 不一定真的 GPU 加速，默认使用 CPU
  device: cpu                 # 可命令行 override：model.params.device=cuda 等

  # 可选：将 AIM workspace 写到当前 run 目录，避免多任务冲突
  # workspace: ${hydra:run.dir}/aim_workspace

  # 兼容现有 CLI 习惯的训练参数（AIM 插件会忽略这些）
  cuda_visible_devices: null  # 例如 "6" 或 "0"；null 表示不设置 CUDA_VISIBLE_DEVICES
  n_iter: ${epochs}
  batch_size: ${batch_size}
  verbose: ${verbose}

