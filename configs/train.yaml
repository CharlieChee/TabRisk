defaults:
  - model: ctgan
  - data: demo
  - preprocess: none
  - _self_

# 训练配置
seed: 42
# 若 use_detailed_output_dir=true（默认），则根据 data/model/train_rows/n_iter 等自动生成目录名；
# 若=false 或命令行显式指定 output_dir=...，则使用 output_dir
use_detailed_output_dir: true
output_dir: outputs/train_${now:%Y%m%d_%H%M%S}

# 训练参数
epochs: 300
batch_size: 500
verbose: true
# 训练时使用的数据行数：null/0 表示使用全部数据；设为正整数（如 2000）则随机抽样该条数参与训练
train_rows: null

# 保存与输出
# save_model: false（默认）不保存模型对象；metadata_only 只保存 plugin name + params（用于重建参考）
save_model: false
# 训练完成后立即生成的合成数据行数（0=不生成）
synthetic_rows: 1000
